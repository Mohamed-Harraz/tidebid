# Render Blueprint: New > Blueprint, pick this repo, Apply.
services:
  - type: web
    name: tidebid
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node src/server.mjs
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
